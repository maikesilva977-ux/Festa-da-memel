<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - 2 Anos da Memel</title>

  <!-- Usa a mesma folha de estilos do site principal, para manter o visual consistente -->
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

  <!-- Frutinhas decorativas, iguais ao index.html -->
  <div class="fruta-decorativa fruta-1">🍉</div>
  <div class="fruta-decorativa fruta-2">🍌</div>
  <div class="fruta-decorativa fruta-3">🍎</div>
  <div class="fruta-decorativa fruta-4">🍈</div>

  <!-- Container onde os confetes caem -->
  <div id="confete-container"></div>

  <!-- ============================= -->
  <!-- TELA DE LOGIN                -->
  <!-- ============================= -->
  <section id="telaLogin" class="tela ativa">
    <div class="cartao">
      <h1>🔑 Painel Admin</h1>

      <p class="mensagem">
        Entre com seu e-mail e senha de administrador para acessar
        o painel de confirmações.
      </p>

      <!-- Campo de e-mail -->
      <input
        type="email"
        id="inputEmail"
        placeholder="E-mail"
        autocomplete="off"
      />

      <!-- Campo de senha -->
      <input
        type="password"
        id="inputSenha"
        placeholder="Senha"
        autocomplete="off"
      />

      <!-- Botão que dispara o login -->
      <button id="btnLogin">Entrar</button>

      <!-- Mensagem de erro, escondida por padrão -->
      <p id="mensagemErroLogin" class="erro escondido">
        E-mail ou senha inválidos.
      </p>
    </div>
  </section>

  <!-- ============================= -->
  <!-- PAINEL (Dashboard)           -->
  <!-- ============================= -->
  <section id="telaPainel" class="tela escondido">
    <div class="cartao cartao-largo">
      <h2>Painel de Confirmações</h2>

      <!-- Cards com os números gerais -->
      <div id="cardsDashboard" class="cards-dashboard">
        <div class="card-numero">
          <p class="card-valor" id="cardTotalFamilias">-</p>
          <p class="card-label">Famílias</p>
        </div>
        <div class="card-numero">
          <p class="card-valor" id="cardTotalConvidados">-</p>
          <p class="card-label">Convidados</p>
        </div>
        <div class="card-numero card-verde">
          <p class="card-valor" id="cardConfirmados">-</p>
          <p class="card-label">Confirmados</p>
        </div>
        <div class="card-numero card-vermelho">
          <p class="card-valor" id="cardNaoConfirmados">-</p>
          <p class="card-label">Não Confirmados</p>
        </div>
        <div class="card-numero card-amarelo">
          <p class="card-valor" id="cardPercentual">-</p>
          <p class="card-label">% Confirmação</p>
        </div>
      </div>

      <!-- Filtros e ordenação -->
      <div class="filtros-container">
        <input
          type="text"
          id="filtroNome"
          placeholder="Buscar por nome..."
          class="filtro-input"
        />
        <input
          type="text"
          id="filtroFamilia"
          placeholder="Buscar por família..."
          class="filtro-input"
        />
        <select id="filtroStatus" class="filtro-select">
          <option value="todos">Todos</option>
          <option value="confirmados">Só confirmados</option>
          <option value="nao-confirmados">Só não confirmados</option>
        </select>
        <select id="ordenarPor" class="filtro-select">
          <option value="familia">Ordenar por Família</option>
          <option value="nome">Ordenar por Nome</option>
          <option value="data">Ordenar por Data</option>
        </select>
      </div>

      <!-- Botões de exportar para Excel -->
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btnExportarExcel" class="botao-secundario">
          📊 Exportar Excel
        </button>
        <button id="btnExportarConfirmados" class="botao-secundario">
          ✅ Exportar só confirmados
        </button>
      </div>

      <!-- Tabela com a lista detalhada de convidados -->
      <div style="overflow-x:auto;">
        <table id="tabelaConvidados" class="tabela-convidados">
          <thead>
            <tr>
              <th>Família</th>
              <th>Pessoa</th>
              <th>Status</th>
              <th>Data confirmação</th>
            </tr>
          </thead>
          <tbody id="corpoTabelaConvidados">
            <!-- As linhas são geradas dinamicamente pelo admin.js -->
          </tbody>
        </table>
      </div>

      <!-- Botão de sair (logout) -->
      <button id="btnSair">Sair</button>
    </div>
  </section>

  <!-- Biblioteca para gerar arquivos Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Script do painel admin (type="module" porque usa import/export do Firebase) -->
  <script type="module" src="admin.js?v=5"></script>

  <!-- Script decorativo dos confetes (mesmo do index.html) -->
  <script src="confete.js"></script>
</body>
</html>
